name: Update BLS data

on:
  # Runs only on BLS release days (16:00 and 20:00 UTC) and the day after (16:00 UTC).
  # Generated from docs/data/release_dates.json by scripts/make_schedule.py; do not edit by hand.
  schedule:
    # --- release schedule (generated) ---
    - cron: "0 16,20 16 1 *"
    - cron: "0 16,20 6 2 *"
    - cron: "0 16,20 3,16,17,29 4 *"
    - cron: "0 16,20 1,19,22 5 *"
    - cron: "0 16,20 3,22 6 *"
    - cron: "0 16,20 1,17,29 7 *"
    - cron: "0 16,20 21 8 *"
    - cron: "0 16,20 2,18,30 9 *"
    - cron: "0 16,20 16,28 10 *"
    - cron: "0 16,20 20 11 *"
    - cron: "0 16,20 2,18,30 12 *"
    - cron: "0 16 17 1 *"
    - cron: "0 16 7 2 *"
    - cron: "0 16 4,17,18,30 4 *"
    - cron: "0 16 2,20,23 5 *"
    - cron: "0 16 4,23 6 *"
    - cron: "0 16 2,18,30 7 *"
    - cron: "0 16 22 8 *"
    - cron: "0 16 3,19 9 *"
    - cron: "0 16 1,17,29 10 *"
    - cron: "0 16 21 11 *"
    - cron: "0 16 3,19,31 12 *"
    # --- end release schedule ---
  workflow_dispatch:        # manual run always fetches, ignoring the gate

permissions:
  contents: write

concurrency:
  group: update-bls-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check release calendar
        id: gate
        if: github.event_name == 'schedule'
        run: |
          if python scripts/check_release.py; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch BLS data
        id: fetch
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          pip install requests
          python scripts/fetch_bls.py

      - name: Log run
        if: steps.fetch.outcome != 'skipped'
        run: |
          f=docs/data/run_log.csv
          [ -f "$f" ] || echo "run_utc,event,outcome,data_updated,series_requested,series_empty,state_month,metro_month" > "$f"
          python - <<'EOF' >> docs/data/run_log.csv
          import json, os, datetime
          m = json.load(open("docs/data/meta.json"))
          print(",".join(str(x) for x in [
              datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              os.environ["EVENT"], os.environ["OUTCOME"], m.get("updated"),
              m.get("series_requested"), m.get("series_empty"),
              m.get("latest_state_month"), m.get("latest_metro_month")]))
          EOF
        env:
          EVENT: ${{ github.event_name }}
          OUTCOME: ${{ steps.fetch.outcome }}

      - name: Commit
        run: |
          # heartbeat keeps scheduled workflows from being disabled after 60 idle days
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-run
          git config user.name "bls-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%F)"
          git pull --rebase
          git push

      - name: Fail visibly if the fetch failed
        if: steps.fetch.outcome == 'failure'
        run: exit 1
