<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USA Workforce Snapshot · Urban Spatial Lab</title>
<meta name="description" content="A full-screen atlas of the U.S. labor market: the latest BLS unemployment and industry employment figures for every state, state capital and major metropolitan statistical area.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- the map is the page -->
<div class="stage" id="stage" aria-label="Map of the United States showing metropolitan statistical areas">
  <svg id="map" viewBox="0 0 975 610" preserveAspectRatio="xMidYMid meet" role="img"></svg>
</div>

<div class="left-stack">
  <!-- masthead: title, latest release, national figures -->
  <header class="hud hud-masthead" id="masthead">
    <div class="mast-row">
      <h1 class="wordmark">USA Workforce<br>Snapshot</h1>
      <img class="logo" src="assets/usl-logo.svg" alt="Urban Spatial Lab">
    </div>
    <p class="release"><span class="release-label">Latest data</span><span class="release-month" id="release-month">–</span></p>

    <button class="nation-stat" id="nation-stat" type="button" aria-label="Open the United States profile">
      <span class="nation-label">United States</span>
      <span class="nation-open">open profile →</span>
    </button>
    <dl class="kpis kpis-us" id="us-kpis"></dl>

    <p class="updated" id="updated"></p>
  </header>

  <!-- map controls under the masthead: lens buttons + search -->
  <div class="hud hud-toolbar" id="toolbar">
    <div class="filters" role="group" aria-label="Map lens">
      <button class="lens-btn is-active" data-lens="industry" aria-pressed="true">Industry</button>
      <button class="lens-btn" data-lens="unemployment" aria-pressed="false">Unemployment</button>
      <button class="lens-btn" data-lens="earnings" aria-pressed="false">Earnings</button>
    </div>
    <div class="search-wrap">
      <input class="search" id="search" type="search" placeholder="Find an MSA, capital or state" aria-label="Find a metropolitan area, capital or state" autocomplete="off">
      <ol class="search-results" id="search-results" hidden></ol>
    </div>
  </div>
</div>

<!-- legend -->
<aside class="hud hud-legend" id="legend" aria-label="Legend"></aside>

<!-- map controls -->
<div class="hud hud-zoom" role="group" aria-label="Zoom">
  <button class="zoom-btn" id="zoom-in" aria-label="Zoom in">+</button>
  <button class="zoom-btn" id="zoom-out" aria-label="Zoom out">−</button>
  <button class="zoom-btn zoom-reset" id="zoom-reset" aria-label="Reset view">⌂</button>
</div>

<!-- pop-out profile -->
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Area profile">
  <button class="drawer-close" id="drawer-close" aria-label="Close profile">×</button>
  <div class="drawer-scroll" id="drawer-body"></div>
</aside>

<footer class="foot" id="foot">Data: U.S. Bureau of Labor Statistics (LAUS · CES · CPI) &nbsp;·&nbsp; Workforce Snapshot is a program of Urban Spatial Lab</footer>

<div class="tip" id="tip" role="tooltip" hidden></div>

<p class="boot" id="boot">Loading BLS data…</p>

<script src="lib/d3.v7.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="app.js"></script>
</body>
</html>
