<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Workforce Monitor</title>
<meta name="description" content="A full-screen atlas of the U.S. labor market: unemployment by state and metro, and the industry make-up of every state capital and major metropolitan area, from BLS LAUS and CES data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- the map is the page -->
<div class="stage" id="stage" aria-label="Map of the United States showing metropolitan areas">
  <svg id="map" viewBox="0 0 975 610" preserveAspectRatio="xMidYMid meet" role="img"></svg>
</div>

<!-- masthead + controls -->
<header class="hud hud-masthead" id="masthead">
  <p class="eyebrow">BLS · LAUS + CES · monthly</p>
  <h1 class="wordmark">The Workforce <span>Monitor</span></h1>
  <p class="dek">Every state capital and major metro drawn as a burst of its industries. Tap one to open its profile.</p>

  <div class="filters" role="group" aria-label="Map lens">
    <button class="lens-btn is-active" data-lens="industry" aria-pressed="true">Industry structure</button>
    <button class="lens-btn" data-lens="unemployment" aria-pressed="false">Unemployment</button>
  </div>

  <div class="search-wrap">
    <input class="search" id="search" type="search" placeholder="Find a metro, capital or state" aria-label="Find a metro, capital or state" autocomplete="off">
    <ol class="search-results" id="search-results" hidden></ol>
  </div>

  <button class="nation-stat" id="nation-stat" type="button" aria-label="Open the United States profile">
    <span class="nation-label">United States</span>
    <span class="nation-value" id="nation-value">–</span>
    <span class="nation-delta" id="nation-delta"></span>
  </button>

  <p class="updated" id="updated"></p>
</header>

<!-- legend -->
<aside class="hud hud-legend" id="legend" aria-label="Legend"></aside>

<!-- map controls -->
<div class="hud hud-zoom" role="group" aria-label="Zoom">
  <button class="zoom-btn" id="zoom-in" aria-label="Zoom in">+</button>
  <button class="zoom-btn" id="zoom-out" aria-label="Zoom out">−</button>
  <button class="zoom-btn zoom-reset" id="zoom-reset" aria-label="Reset view">⌂</button>
</div>

<!-- pop-out profile -->
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Area profile">
  <button class="drawer-close" id="drawer-close" aria-label="Close profile">×</button>
  <div class="drawer-scroll" id="drawer-body"></div>
</aside>

<div class="tip" id="tip" role="tooltip" hidden></div>

<p class="boot" id="boot">Loading BLS data…</p>

<script src="lib/d3.v7.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="app.js"></script>
</body>
</html>
